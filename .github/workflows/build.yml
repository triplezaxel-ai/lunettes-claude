name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job publishes the APK as a release and pushes the build result to the `ci` branch.
permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Also checks that the Gradle wrapper jar in the repository is a genuine one.
      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in the repository's Actions secrets. Forks and pull requests do
      # not get secrets, so their builds fall back to a throwaway key.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/signing.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
            echo "kind=project key" >> "$GITHUB_OUTPUT"
          elif [ -f signing/lunettes.p12 ]; then
            # Fixed key kept in this private repository, so every build installs over the last.
            cp signing/lunettes.p12 "$RUNNER_TEMP/signing.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
            echo "SIGNING_KEYSTORE_PASSWORD=$(cat signing/password.txt)" >> "$GITHUB_ENV"
            echo "kind=repository key" >> "$GITHUB_OUTPUT"
          else
            echo "kind=throwaway key" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        id: build
        env:
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$SECRET_KEYSTORE_PASSWORD" ]; then export SIGNING_KEYSTORE_PASSWORD="$SECRET_KEYSTORE_PASSWORD"; fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.p12"

      # The result goes to the `ci` branch too, so a build can be checked with plain git.
      - name: Publish result to the ci branch
        if: always()
        run: |
          mkdir -p out
          tail -n 400 build.log > out/build-tail.log || true
          grep -nE "^e: |error:|FAILED|What went wrong|Could not" build.log | head -n 200 > out/errors.log || true
          cp app/build/outputs/apk/debug/app-debug.apk out/lunettes-claude.apk || true
          echo "${{ github.sha }} ${{ steps.build.outcome }} run=${{ github.run_number }} signing=${{ steps.signing.outputs.kind }}" > out/STATUS
          cd out
          git init -q -b ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lunettes-claude-apk
          path: out/lunettes-claude.apk

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256=$(sha256sum out/lunettes-claude.apk | cut -d' ' -f1)
          {
            echo "Built from commit ${{ github.sha }}."
            echo
            echo "Signed with: ${{ steps.signing.outputs.kind }}"
            echo "SHA-256 of lunettes-claude.apk: $SHA256"
          } > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/lunettes-claude.apk \
            --target "${{ github.sha }}" \
            --title "Lunettes Claude build ${{ github.run_number }}" \
            --notes-file notes.md
